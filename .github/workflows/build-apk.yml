
name: HeadLab APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android Project
        run: |
          ROOT=$(find . -name settings.gradle.kts \
            -not -path '*/.gradle/*' \
            -print -quit | xargs dirname)
          if [ -z "$ROOT" ] || [ ! -d "$ROOT/app" ]; then
            echo "Android project not found!"
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> $GITHUB_ENV

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeadLab-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          
